<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f5f3ed"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="ふたりのお小遣い"><title>ふたりのお小遣い</title><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="styles.css"></head>
<body><main>
<header><a class="brand" href="./"><span class="mark">ふ</span><span>ふたりのお小遣い<small>OUR LITTLE WALLETS</small></span></a><span class="pill">毎月ひとり $150</span></header>
<section id="loginPanel" class="panel login"><p class="eyebrow">A LITTLE FREEDOM, TOGETHER.</p><h1>ふたりのお金を、<br>ひと目で。</h1><p>Ritsuya と honami のお小遣いを<br>同じ画面で、いっしょに管理。</p><form id="loginForm"><label>共有アカウントのメール<input id="email" type="email" autocomplete="username" required></label><label>パスワード<input id="password" type="password" autocomplete="current-password" required></label><button class="primary" id="loginButton">ログイン</button></form><p class="fine">ふたりの端末で同じアカウントにログインしてください。</p><a class="textbutton" href="?demo=1">画面を試す →</a></section>
<section id="appPanel" hidden>
<div class="intro"><div><p class="eyebrow">YOUR MONTHLY POCKET MONEY</p><h1>ふたりの、今のお小遣い。</h1><p id="monthNote"></p></div><button id="refresh" class="quiet">↻ 更新</button></div>
<div id="cards" class="cards"></div>
<p class="fine rule">毎月1日、それぞれに $150。残りは翌月へ繰り越し。</p>
<section class="panel composer"><div class="section-title"><h2 id="formTitle">使ったお金を記録</h2><span class="subtle">かんたん入力</span></div><form id="entryForm"><fieldset><legend>誰のお小遣い？</legend><div class="segmented"><button type="button" data-person="Ritsuya" aria-pressed="true">Ritsuya</button><button type="button" data-person="honami" aria-pressed="false">honami</button></div></fieldset><div class="fields"><label>金額（USD）<div class="money-input"><span>$</span><input id="amount" type="number" inputmode="decimal" min="0.01" max="1000000" step="0.01" placeholder="0.00" required></div></label><label>日付<input id="date" type="date" required></label></div><div class="fields"><label>種類<select id="kind"><option value="expense">支出</option><option value="refund">返金・追加チャージ</option></select></label><label>メモ<input id="memo" maxlength="200" placeholder="ランチ、洋服など"></label></div><div class="actions"><button id="save" class="primary" type="submit">Ritsuya の支出を記録</button><button id="cancel" class="quiet" type="button" hidden>キャンセル</button></div></form></section>
<section class="panel history"><div class="section-title"><h2>ふたりの記録</h2><input type="month" id="historyMonth" aria-label="履歴の月"></div><div id="history"></div></section>
<footer><span id="syncStatus" role="status"></span><div><button id="export" class="textbutton">CSVを書き出す</button><button id="logout" class="textbutton">ログアウト</button></div><small>ふたりのお小遣い · v1.0</small></footer>
</section><p id="message" class="message" role="status" aria-live="polite" hidden></p>
</main><script src="config.js"></script><script src="core.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js"></script><script src="app.js"></script></body></html>
